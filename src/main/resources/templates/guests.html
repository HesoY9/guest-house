<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guests - Guest House</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/htmx.min.js}"></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Guests</h1>

    <form th:hx-post="@{/web/guests}" hx-target="#guests-panel" hx-swap="outerHTML" class="inline-form">
        <input type="text" name="idOrPassport" placeholder="ID / Passport" required>
        <input type="text" name="name" placeholder="Full name" required>
        <input type="text" name="contactNumber" placeholder="Contact number" required>
        <button type="submit">Register Guest</button>
    </form>

    <input type="text" name="name" placeholder="Search by name..."
           th:hx-get="@{/web/guests/search}"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#guests-panel" hx-swap="outerHTML">

    <div th:replace="~{fragments/guests-panel :: panel}"></div>
</main>
</body>
</html>
