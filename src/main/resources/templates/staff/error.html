<!DOCTYPE html>
<!-- Shown for a refused action or missing record on a full staff page load (HTMX requests get a toast instead). -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>That didn't work · Beachside Heaven Staff</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/staff.css}">
</head>
<body class="login-body">
<main class="login-panel">
    <div class="login-card">
        <h1>That didn't work</h1>
        <p class="form-error" th:text="${message}">Message</p>
        <a class="btn btn-primary" th:href="@{/web}">Back to the staff portal</a>
    </div>
</main>
</body>
</html>
