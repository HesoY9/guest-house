spring.application.name=guesthouse

# 1. Database Connection URL (Change 'localhost' to a remote IP later)
spring.datasource.url=jdbc:mysql://localhost:3306/guesthouse_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# 2. Database Credentials
spring.datasource.username=guesthouse_user
spring.datasource.password=Constantine_Sky4
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Hibernate/JPA Settings
# 'update' automatically creates/updates database tables based on your OOP Java Classes
spring.jpa.hibernate.ddl-auto=update
# Shows the SQL queries in your console (great for debugging your OOP project)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.servlet.session.timeout=30m

spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Without this, /api/** is denied entirely now that real Spring Security is active -
# set true while you're developing/testing with Postman.
site.rest-api-enabled=true






