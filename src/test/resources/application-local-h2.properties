# "local-h2" profile: runs the whole app on an in-memory database with demo data, so you can
# try it without MySQL or any secrets. Nothing is saved - data resets on every restart.
#
#   mvn spring-boot:run -Dspring-boot.run.useTestClasspath=true -Dspring-boot.run.profiles=local-h2
#
# Also used by GuesthouseApplicationTests so "mvn test" works on any machine.
spring.datasource.url=jdbc:h2:mem:guesthouse;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Google sign-in needs real values to actually work; placeholders just let the app start.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-placeholder}

# Demo-only first admin password (in-memory database only - never used for MySQL).
ADMIN_INITIAL_PASSWORD=demo-admin-2026
app.upload-dir=target/demo-uploads
