<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rooms - Guest House</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/htmx.min.js}"></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Rooms</h1>

    <form th:hx-post="@{/web/rooms}" hx-target="#rooms-panel" hx-swap="outerHTML" class="inline-form">
        <input type="text" name="roomNumber" placeholder="Room number" required>
        <select name="type" required>
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Suite">Suite</option>
        </select>
        <input type="number" step="0.01" name="price" placeholder="Price per night" required>
        <select name="status" required>
            <option value="AVAILABLE">Available</option>
            <option value="RESERVED">Reserved</option>
            <option value="OCCUPIED">Occupied</option>
            <option value="CLEANING_REQUIRED">Cleaning Required</option>
        </select>
        <button type="submit">Add Room</button>
    </form>

    <div th:replace="~{fragments/rooms-panel :: panel}"></div>
</main>
</body>
</html>
