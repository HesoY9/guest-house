<div xmlns:th="http://www.thymeleaf.org" th:fragment="grid" id="room-grid" class="room-grid">
    <p th:if="${checkInDate != null}" class="search-summary">
        Showing rooms available <span th:text="${checkInDate}"></span> to <span th:text="${checkOutDate}"></span>
    </p>
    <p th:if="${#lists.isEmpty(rooms)}" class="feedback error">No rooms available for those dates.</p>

    <div class="room-card" th:each="room : ${rooms}">
        <img th:if="${room.imageUrl != null}"
             th:src="${room.imageUrl.startsWith('http')} ? ${room.imageUrl} : @{'/images/' + ${room.imageUrl}}"
             alt="" class="room-card-image">
        <div th:unless="${room.imageUrl != null}" class="room-card-image room-card-image-placeholder">No photo yet</div>

        <div class="room-card-body">
            <h3 th:text="${room.type} + ' - Room ' + ${room.roomNumber}"></h3>
            <p class="room-card-description" th:text="${room.description} ?: 'A comfortable room at our guest house.'"></p>
            <p class="room-card-price"><strong th:text="'$' + ${room.price}"></strong> / night</p>
            <a th:href="@{/book/{id}(id=${room.id})}" class="btn-book">Book Now</a>
        </div>
    </div>
</div>
