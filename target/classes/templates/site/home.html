<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hesoy9 Guest House - Book Your Stay</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script th:src="@{/js/htmx.min.js}"></script>
</head>
<body>
<div th:replace="~{site/fragments/site-nav :: nav}"></div>

<section class="hero">
    <h1>Find your perfect stay</h1>
    <p>Comfortable rooms, easy booking.</p>
    <form class="search-bar" th:hx-get="@{/search}" hx-target="#room-grid" hx-swap="outerHTML">
        <label>Check-in
            <input type="date" name="checkInDate" required>
        </label>
        <label>Check-out
            <input type="date" name="checkOutDate" required>
        </label>
        <button type="submit">Search</button>
    </form>
</section>

<main class="container">
    <div th:replace="~{site/fragments/room-grid :: grid}"></div>
</main>
</body>
</html>
