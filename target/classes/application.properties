spring.application.name=guesthouse

# 1. Database Connection URL (Change 'localhost' to a remote IP later)
spring.datasource.url=jdbc:mysql://localhost:3306/guesthouse_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# 2. Database Credentials
spring.datasource.username=guesthouse_user
spring.datasource.password=Constantine_Sky4
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Hibernate/JPA Settings
# 'update' automatically creates/updates database tables based on your OOP Java Classes
spring.jpa.hibernate.ddl-auto=update
# Shows the SQL queries in your console (great for debugging your OOP project)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
