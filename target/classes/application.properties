spring.application.name=guesthouse

# Secrets are NEVER written in this file - it is committed to GitHub.
# They come from environment variables. For local development, copy .env.example to .env
# (which is git-ignored) and fill it in; the line below loads it if it exists.
spring.config.import=optional:file:.env[.properties]

# 1. Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/guesthouse_db
spring.datasource.username=guesthouse_user
spring.datasource.password=Constantine_Sky4
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Hibernate/JPA settings
# 'update' automatically creates/updates database tables based on your OOP Java Classes
spring.jpa.hibernate.ddl-auto=update
# Shows the SQL queries in your console - set SHOW_SQL=true while debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Error pages never leak internals
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Secrets go here
secrets
spring.security.oauth2.client.registration.google.client-id=733021181781-fnk230q3m8ice58tlb05vcr5cjusgpul.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=openid,email,profile


# 5. The REST API under /api/** has no login of its own, so it is OFF unless you switch it on.
# Set REST_API_ENABLED=true only on your own machine for Postman testing.
site.rest-api-enabled=false

# 6. Public address of the site - used for links inside confirmation emails
app.base-url=http://localhost

# 7. Where uploaded room photos are stored on disk (served at /uploads/**)
app.upload-dir=/home/hesoy/uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 8. Confirmation emails. Leave MAIL_HOST empty and emails are written to the log instead of sent.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Sender address - defaults to the SMTP username
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
